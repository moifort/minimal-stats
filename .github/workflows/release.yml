name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign
        run: make sign VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify signature
        run: codesign --verify --deep --strict Stats.app

      - name: Zip app
        run: ditto -c -k --keepParent Stats.app Stats.app.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Stats.app.zip
          generate_release_notes: true
